services:
  - type: web
    name: the-drop-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: cd server && npx tsx src/index.ts
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://qrustonvr.github.io
    healthCheckPath: /health
